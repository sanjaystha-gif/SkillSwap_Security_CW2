name: Security CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          cd backend
          npm ci
      - name: Run lint
        run: |
          cd backend
          npm run lint || true
      - name: Run tests
        run: |
          cd backend
          npm test || true
      - name: Run npm audit
        run: |
          cd backend
          npm audit --audit-level=moderate || true
      - name: Dependency check summary
        run: |
          echo "Security checks completed"
