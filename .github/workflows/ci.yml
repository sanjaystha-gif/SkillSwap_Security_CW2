name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skillswap_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Lint backend
        run: cd backend && npm run lint

      - name: Run backend tests
        run: cd backend && npm run test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: skillswap_test
          DB_USER: test_user
          DB_PASSWORD: test_password
          REDIS_HOST: localhost

      - name: Audit dependencies
        run: cd backend && npm audit --max-severity=moderate

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Lint frontend
        run: cd frontend && npm run lint

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Start frontend preview and run E2E tests
        run: |
          cd frontend
          # ensure build present
          npm run build
          # start preview server in background
          npx vite preview --port 5173 &
          sleep 2
          # install Playwright browsers and run tests
          npx playwright install --with-deps
          npx playwright test

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Enable GitHub secret scanning
        run: echo "Secret scanning enabled via repository settings"

      - name: Install dependencies for scanning
        run: |
          cd backend
          npm ci
          npm audit

  docker:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker-compose build

      - name: Test Docker Compose
        run: docker-compose config
